<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saarthi</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <h1>🧭 Saarthi</h1><p class="tag">Your voice-guided web assistant</p>
    <div id="status" role="status">Ready to help. Try “Explain this page”.</div>
    <button id="listen">🎙️ Tap to speak</button>
    <button id="explain" class="secondary">Explain this page</button>
    <button id="stop" class="secondary">Stop audio</button>
    <p class="hint">Demo commands: “Explain this page”, “Find the status button”, “Click check status”.</p>
  </main><script src="popup.js"></script>
</body></html>
